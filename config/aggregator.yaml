# news-bot configuration
# Single source of truth for sources, keywords, weights, and digest labels.
# Edit this file to tune the bot — no code changes required.

time_window_hours: 24

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

sources:
  rss:
    enabled: true
    feeds:
      # --- Anthropic / Claude ecosystem ---
      - { url: https://www.anthropic.com/rss.xml,                            name: Anthropic Blog }
      - { url: https://simonwillison.net/atom/everything/,                   name: Simon Willison }
      # --- Major AI labs ---
      - { url: https://openai.com/blog/rss.xml,                              name: OpenAI Blog }
      - { url: https://deepmind.google/blog/rss.xml,                         name: DeepMind Blog }
      - { url: https://blogs.microsoft.com/ai/feed/,                         name: Microsoft AI Blog }
      - { url: https://blogs.nvidia.com/blog/category/ai/feed/,              name: Nvidia AI Blog }
      - { url: https://blog.google/technology/ai/rss/,                       name: Google AI Blog }
      - { url: https://ai.meta.com/blog/rss/,                                name: Meta AI Blog }
      - { url: https://mistral.ai/feed/,                                     name: Mistral AI Blog }
      # --- Research & deep dives ---
      - { url: https://hf.co/blog/feed.xml,                                  name: Hugging Face Blog }
      - { url: https://jamesg.blog/hf-papers.xml,                            name: Hugging Face Papers }
      - { url: https://lilianweng.github.io/index.xml,                       name: Lilian Weng }
      - { url: https://magazine.sebastianraschka.com/feed,                   name: Ahead of AI }
      - { url: https://interconnects.ai/feed,                                name: Interconnects }
      - { url: https://www.deeplearning.ai/the-batch/rss/,                   name: The Batch }
      - { url: https://thegradient.pub/rss/,                                 name: The Gradient }
      - { url: https://jalammar.github.io/feed.xml,                          name: Jay Alammar }
      - { url: https://www.latent.space/feed,                                name: Latent Space }
      - { url: https://importai.substack.com/feed,                           name: Import AI }
      - { url: https://paperswithcode.com/latest.rss,                        name: Papers with Code }
      - { url: https://news.mit.edu/rss/topic/artificial-intelligence2,      name: MIT AI News }
      # --- Industry news ---
      - { url: https://venturebeat.com/ai/feed/,                             name: VentureBeat AI }
      - { url: https://techcrunch.com/category/artificial-intelligence/feed/, name: TechCrunch AI }
      - { url: https://arstechnica.com/ai/feed/,                             name: Ars Technica AI }
      - { url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml, name: The Verge AI }
      # --- Curated newsletters ---
      - { url: https://tldr.tech/api/rss/ai,                                 name: TLDR AI }

  hackernews:
    enabled: true
    top_stories:
      fetch_n: 80
      min_score: 100
    algolia:
      keywords: [Claude, GPT, Anthropic, OpenAI, LLM, Gemini, Cursor, MCP, DeepSeek, Mistral, "AI agent", "Claude Code", Grok, Llama]
      min_points: 50

  reddit:
    enabled: true
    subreddits:
      - { name: LocalLLaMA,      sort: hot,  limit: 25, min_score: 100 }
      - { name: MachineLearning, sort: hot,  limit: 20, min_score: 60 }
      - { name: ClaudeAI,        sort: hot,  limit: 15, min_score: 30 }
      - { name: OpenAI,          sort: hot,  limit: 15, min_score: 80 }
      - { name: singularity,     sort: top,  limit: 15, min_score: 300, time_filter: day }
      - { name: LocalLLM,        sort: hot,  limit: 15, min_score: 50 }
      - { name: artificial,      sort: hot,  limit: 20, min_score: 200 }
      - { name: ChatGPT,         sort: hot,  limit: 15, min_score: 500 }
      - { name: Anthropic,       sort: hot,  limit: 15, min_score: 20 }

  github:
    enabled: true
    releases:
      # Inference & runtimes
      - { owner: vllm-project,          repo: vllm,                    topics: [llm, inference] }
      - { owner: ollama,                repo: ollama,                  topics: [llm, inference] }
      - { owner: ggerganov,             repo: llama.cpp,               topics: [llm, inference] }
      - { owner: exo-explore,           repo: exo,                     topics: [llm, inference] }
      # Models & training
      - { owner: huggingface,           repo: transformers,            topics: [llm, transformer] }
      - { owner: huggingface,           repo: diffusers,               topics: [diffusion-models] }
      - { owner: unslothai,             repo: unsloth,                 topics: [llm, fine-tuning] }
      - { owner: meta-llama,            repo: llama-stack,             topics: [llm, agent] }
      # AI SDKs & APIs
      - { owner: anthropics,            repo: anthropic-sdk-python,    topics: [llm, claude] }
      - { owner: anthropics,            repo: claude-code,             topics: [agent, ai-agent, claude, mcp] }
      - { owner: openai,                repo: openai-python,           topics: [llm] }
      - { owner: openai,                repo: openai-agents-python,    topics: [agent, ai-agent, llm] }
      - { owner: BerriAI,               repo: litellm,                 topics: [llm, tool, agent-framework] }
      # Agent frameworks
      - { owner: langchain-ai,          repo: langchain,               topics: [agent, agent-framework, llm] }
      - { owner: microsoft,             repo: autogen,                 topics: [agent, multi-agent, agent-framework] }
      - { owner: microsoft,             repo: semantic-kernel,         topics: [agent, agent-framework] }
      - { owner: run-llama,             repo: llama_index,             topics: [agent, rag, llm] }
      - { owner: stanfordnlp,           repo: dspy,                    topics: [llm, agent-framework] }
      - { owner: crewAIInc,             repo: crewAI,                  topics: [agent, multi-agent, agent-framework] }
      - { owner: pydantic,              repo: pydantic-ai,             topics: [agent, agent-framework, llm, tool] }
      - { owner: huggingface,           repo: smolagents,              topics: [agent, ai-agent, agent-framework, llm] }
      # MCP ecosystem
      - { owner: modelcontextprotocol,  repo: servers,                 topics: [mcp, mcp-server] }
      - { owner: modelcontextprotocol,  repo: python-sdk,              topics: [mcp, llm] }
      - { owner: jlowin,                repo: fastmcp,                 topics: [mcp, mcp-server, tool] }
      # Dev tools & coding
      - { owner: Aider-AI,              repo: aider,                   topics: [ai-agent, agent] }
      - { owner: cline,                 repo: cline,                   topics: [ai-agent, agent, mcp] }
      # Other
      - { owner: browser-use,           repo: browser-use,             topics: [agent, ai-agent, tool] }
      - { owner: mem0ai,                repo: mem0,                    topics: [agent, llm, tool] }
      - { owner: microsoft,             repo: markitdown,              topics: [tool] }
      - { owner: comfyanonymous,        repo: ComfyUI,                 topics: [diffusion-models] }
    search:
      topics: [llm, agent, rag, mcp, transformer, diffusion-models, mcp-server, ai-agent]
      min_stars: 500
    user_events: [karpathy, ggerganov, simonw, jxnl, sw-yx, jeremyphoward]
    event_repo_topics:
      "anthropics/claude-code":       [agent, ai-agent, claude, mcp]
      "simonw/llm":                   [llm, tool]
      "ggerganov/llama.cpp":          [llm, inference]
      "ggerganov/whisper.cpp":        [whisper]
      "karpathy/nanochat":            [llm]
      "karpathy/llm.c":               [llm]
      "jxnl/instructor":              [llm, tool]
      "pydantic/pydantic-ai":         [llm, agent-framework, tool]
      "browser-use/browser-use":      [llm, ai-agent, tool]
      "huggingface/smolagents":       [llm, ai-agent, agent-framework]
      "openai/openai-agents-python":  [llm, ai-agent, agent-framework]
      "modelcontextprotocol/servers": [mcp, mcp-server]
      "BerriAI/litellm":              [llm, tool, agent-framework]

  telegram:
    enabled: false
    channels: []
    per_channel_limit: 30

  anthropic_official:
    enabled: true

# ---------------------------------------------------------------------------
# LLM-based relevance scoring (requires ANTHROPIC_API_KEY secret)
# ---------------------------------------------------------------------------
# When ANTHROPIC_API_KEY is set, each batch of items is sent to Claude Haiku
# and scored 1-10. Items below min_score are dropped before formatting.
# Cost: ~$0.001/day. Falls back silently if the API call fails.

llm_scoring:
  enabled: true
  model: gemini-2.0-flash   # free tier: 1,500 req/day — daily run uses ~1-2
  min_score: 6              # drop items scoring below this (1–10 scale)
  batch_size: 40            # items per API call

# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------

scoring:
  min_score: 3               # keyword pre-filter; LLM does the heavy lifting
  max_items: 60              # increased so LLM has more candidates to rank

